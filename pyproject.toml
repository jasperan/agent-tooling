[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tooling-layer"
version = "0.2.0"
description = "The Tooling Layer - Transform agent decisions into actions via unified tool abstractions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ignacio Martinez", email = "ignacio.martinez@oracle.com"}
]
keywords = [
    "ai", "agents", "tooling", "mcp", "model-context-protocol",
    "function-calling", "llm", "langchain", "oracle"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "typer>=0.9.0",
    "inquirer>=3.1.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=0.1.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
ollama = [
    "anthropic>=0.40.0",
]
media = [
    "pymupdf>=1.24.0",
]
openhands = [
    "openhands-sdk>=0.1.0",
    "openhands-tools>=0.1.0",
]
docker = [
    "openhands-sdk>=0.1.0",
    "openhands-tools>=0.1.0",
    "openhands-workspace>=0.1.0",
]
pidev = []  # Protocol-only, no Python deps needed
all = [
    "agent-tooling-layer[mcp,server,ollama,media,openhands,docker,pidev]",
]

[dependency-groups]
dev = [{include-group = "lint"}, {include-group = "test"}]
lint = ["ruff>=0.9"]
test = ["pytest>=8.0", "pytest-asyncio>=0.21.0", "tomli>=2.0.0;python_version<'3.11'"]

[project.urls]
Homepage = "https://github.com/jasperan/agent-tooling"
Documentation = "https://github.com/jasperan/agent-tooling#readme"
Repository = "https://github.com/jasperan/agent-tooling"
Issues = "https://github.com/jasperan/agent-tooling/issues"

[project.scripts]
agent-tooling = "agent_tooling.cli:main"
agent-tooling-server = "agent_tooling.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_tooling = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
